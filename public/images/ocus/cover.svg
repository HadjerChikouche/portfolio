<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <radialGradient id="bg" cx="35%" cy="55%" r="70%">
      <stop offset="0%" stop-color="#12131F"/>
      <stop offset="100%" stop-color="#060609"/>
    </radialGradient>
    <linearGradient id="pathHigh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3D6FE8" stop-opacity="0"/>
      <stop offset="20%" stop-color="#3D6FE8" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#5B8AF0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#5B8AF0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pathMid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8913D" stop-opacity="0"/>
      <stop offset="25%" stop-color="#E8913D" stop-opacity="0.7"/>
      <stop offset="75%" stop-color="#E8913D" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#E8913D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pathLow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9CA3AF" stop-opacity="0"/>
      <stop offset="30%" stop-color="#9CA3AF" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#9CA3AF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#9CA3AF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowStrong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <clipPath id="clip">
      <rect width="1200" height="900"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- Subtle dot grid -->
  <g opacity="0.06">
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#8896B3"/>
    </pattern>
    <rect width="1200" height="900" fill="url(#dots)"/>
  </g>

  <!-- Zone separator lines -->
  <line x1="160" y1="260" x2="1040" y2="260" stroke="#3D6FE8" stroke-width="0.5" stroke-opacity="0.18" stroke-dasharray="6 10"/>
  <line x1="160" y1="480" x2="1040" y2="480" stroke="#E8913D" stroke-width="0.5" stroke-opacity="0.18" stroke-dasharray="6 10"/>
  <line x1="160" y1="680" x2="1040" y2="680" stroke="#4B5563" stroke-width="0.5" stroke-opacity="0.15" stroke-dasharray="6 10"/>

  <!-- Zone labels — left margin -->
  <text x="80" y="370" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9" fill="#3D6FE8" fill-opacity="0.5" letter-spacing="0.18em" text-anchor="middle" transform="rotate(-90, 80, 370)">HIGH CONFIDENCE</text>
  <text x="80" y="575" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9" fill="#E8913D" fill-opacity="0.5" letter-spacing="0.18em" text-anchor="middle" transform="rotate(-90, 80, 575)">REVIEW QUEUE</text>
  <text x="80" y="760" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9" fill="#6B7280" fill-opacity="0.4" letter-spacing="0.18em" text-anchor="middle" transform="rotate(-90, 80, 760)">MANUAL</text>

  <!-- === HIGH CONFIDENCE PATH === -->
  <!-- Main flowing line -->
  <path d="M 160 360 C 280 360, 320 340, 400 340 C 480 340, 500 350, 560 350 C 620 350, 660 330, 760 330 C 840 330, 900 345, 1040 345"
        stroke="url(#pathHigh)" stroke-width="1.5" fill="none" filter="url(#glow)"/>
  <!-- Glowing version -->
  <path d="M 160 360 C 280 360, 320 340, 400 340 C 480 340, 500 350, 560 350 C 620 350, 660 330, 760 330 C 840 330, 900 345, 1040 345"
        stroke="#3D6FE8" stroke-width="3" fill="none" opacity="0.15" filter="url(#glowStrong)"/>

  <!-- Decision nodes on high path -->
  <circle cx="400" cy="340" r="5" fill="#3D6FE8" opacity="0.9" filter="url(#glow)"/>
  <circle cx="400" cy="340" r="10" fill="none" stroke="#3D6FE8" stroke-width="0.8" opacity="0.35"/>
  <circle cx="560" cy="350" r="4" fill="#3D6FE8" opacity="0.8"/>
  <circle cx="760" cy="330" r="5" fill="#3D6FE8" opacity="0.9" filter="url(#glow)"/>
  <circle cx="760" cy="330" r="10" fill="none" stroke="#3D6FE8" stroke-width="0.8" opacity="0.35"/>

  <!-- Score labels on high path -->
  <text x="400" y="322" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#3D6FE8" fill-opacity="0.7" text-anchor="middle" letter-spacing="0.05em">0.91</text>
  <text x="760" y="314" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#3D6FE8" fill-opacity="0.7" text-anchor="middle" letter-spacing="0.05em">0.87</text>

  <!-- === REVIEW QUEUE PATH === -->
  <path d="M 160 560 C 260 560, 300 540, 380 545 C 460 550, 490 565, 570 565 C 650 565, 690 550, 800 555 C 880 558, 940 570, 1040 568"
        stroke="url(#pathMid)" stroke-width="1.5" fill="none" filter="url(#glow)"/>
  <path d="M 160 560 C 260 560, 300 540, 380 545 C 460 550, 490 565, 570 565 C 650 565, 690 550, 800 555 C 880 558, 940 570, 1040 568"
        stroke="#E8913D" stroke-width="3" fill="none" opacity="0.1" filter="url(#glowStrong)"/>

  <circle cx="380" cy="545" r="4.5" fill="#E8913D" opacity="0.85" filter="url(#glow)"/>
  <circle cx="380" cy="545" r="9" fill="none" stroke="#E8913D" stroke-width="0.8" opacity="0.3"/>
  <circle cx="570" cy="565" r="3.5" fill="#E8913D" opacity="0.7"/>
  <circle cx="800" cy="555" r="4.5" fill="#E8913D" opacity="0.85" filter="url(#glow)"/>
  <circle cx="800" cy="555" r="9" fill="none" stroke="#E8913D" stroke-width="0.8" opacity="0.3"/>

  <text x="380" y="528" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#E8913D" fill-opacity="0.6" text-anchor="middle" letter-spacing="0.05em">0.63</text>
  <text x="800" y="538" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#E8913D" fill-opacity="0.6" text-anchor="middle" letter-spacing="0.05em">0.71</text>

  <!-- === MANUAL PATH === -->
  <path d="M 160 740 C 280 740, 310 750, 430 748 C 550 746, 580 755, 680 752 C 780 749, 860 760, 1040 758"
        stroke="url(#pathLow)" stroke-width="1" fill="none"/>

  <circle cx="430" cy="748" r="3.5" fill="#9CA3AF" opacity="0.5"/>
  <circle cx="680" cy="752" r="3.5" fill="#9CA3AF" opacity="0.5"/>

  <text x="430" y="732" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#9CA3AF" fill-opacity="0.4" text-anchor="middle" letter-spacing="0.05em">0.38</text>

  <!-- === ROUTING DECISION BRANCHES — from high path down to review === -->
  <path d="M 560 350 Q 575 440, 570 480" stroke="#3D6FE8" stroke-width="0.8" fill="none" opacity="0.2" stroke-dasharray="4 6"/>
  <path d="M 380 545 Q 375 500, 370 480" stroke="#E8913D" stroke-width="0.8" fill="none" opacity="0.2" stroke-dasharray="4 6"/>

  <!-- === INTAKE FUNNEL (left edge) === -->
  <rect x="130" y="300" width="30" height="50" rx="3" fill="#3D6FE8" fill-opacity="0.12" stroke="#3D6FE8" stroke-width="0.6" stroke-opacity="0.4"/>
  <rect x="130" y="500" width="30" height="50" rx="3" fill="#E8913D" fill-opacity="0.10" stroke="#E8913D" stroke-width="0.6" stroke-opacity="0.3"/>
  <rect x="130" y="700" width="30" height="50" rx="3" fill="#4B5563" fill-opacity="0.10" stroke="#6B7280" stroke-width="0.5" stroke-opacity="0.25"/>

  <!-- INTAKE label -->
  <text x="145" y="296" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="8" fill="#8896B3" fill-opacity="0.4" text-anchor="middle" letter-spacing="0.12em">INTAKE</text>

  <!-- === OUTPUT NODES (right edge) === -->
  <rect x="1040" y="310" width="32" height="50" rx="3" fill="#3D6FE8" fill-opacity="0.14" stroke="#3D6FE8" stroke-width="0.6" stroke-opacity="0.5"/>
  <text x="1071" y="329" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="7.5" fill="#3D6FE8" fill-opacity="0.55" text-anchor="middle" letter-spacing="0.1em" transform="rotate(90,1071,329)">AUTO</text>
  <rect x="1040" y="535" width="32" height="50" rx="3" fill="#E8913D" fill-opacity="0.12" stroke="#E8913D" stroke-width="0.6" stroke-opacity="0.4"/>
  <text x="1071" y="553" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="7.5" fill="#E8913D" fill-opacity="0.5" text-anchor="middle" letter-spacing="0.1em" transform="rotate(90,1071,553)">REVIEW</text>
  <rect x="1040" y="725" width="32" height="50" rx="3" fill="#4B5563" fill-opacity="0.10" stroke="#6B7280" stroke-width="0.5" stroke-opacity="0.25"/>

  <!-- === THRESHOLD ANNOTATIONS === -->
  <text x="1055" y="258" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="8.5" fill="#3D6FE8" fill-opacity="0.45" text-anchor="middle" letter-spacing="0.15em">τ₁ = 0.80</text>
  <text x="1055" y="476" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="8.5" fill="#E8913D" fill-opacity="0.45" text-anchor="middle" letter-spacing="0.15em">τ₂ = 0.55</text>

  <!-- === WORDMARK — top left === -->
  <text x="156" y="160" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display',system-ui,sans-serif" font-size="68" font-weight="700" fill="#FFFFFF" fill-opacity="0.92" letter-spacing="-0.03em">OCUS</text>
  <text x="157" y="190" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#8896B3" fill-opacity="0.45" letter-spacing="0.22em">CONFIDENCE-BASED ROUTING</text>

  <!-- === Subtle vignette at edges === -->
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="40%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#030305" stop-opacity="0.7"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#vignette)"/>
</svg>
