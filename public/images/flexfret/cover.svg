<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <radialGradient id="bg-glow" cx="40%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1F1F38"/>
      <stop offset="100%" stop-color="#0E0E1B"/>
    </radialGradient>
    <radialGradient id="node-glow-orange" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E85D04" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#E85D04" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="node-glow-warm" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FAFAF8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FAFAF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="node-glow-muted" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9A9A92" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#9A9A92" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E85D04" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#E85D04" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="edge-warm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FAFAF8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FAFAF8" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="edge-muted" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6B6B63" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#6B6B63" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="glow-sm">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-lg">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#E85D04" opacity="0.85"/>
    </marker>
    <marker id="arrow-warm" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#FAFAF8" opacity="0.45"/>
    </marker>
    <marker id="arrow-muted" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6B6B63" opacity="0.6"/>
    </marker>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0E0E1B" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0E0E1B" stop-opacity="0.62"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bg-glow)"/>

  <!-- Subtle grid -->
  <g opacity="0.035" stroke="#FAFAF8" stroke-width="0.5">
    <line x1="0" y1="100" x2="1200" y2="100"/><line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/><line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="0" y1="700" x2="1200" y2="700"/>
    <line x1="100" y1="0" x2="100" y2="800"/><line x1="200" y1="0" x2="200" y2="800"/>
    <line x1="300" y1="0" x2="300" y2="800"/><line x1="400" y1="0" x2="400" y2="800"/>
    <line x1="500" y1="0" x2="500" y2="800"/><line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="700" y1="0" x2="700" y2="800"/><line x1="800" y1="0" x2="800" y2="800"/>
    <line x1="900" y1="0" x2="900" y2="800"/><line x1="1000" y1="0" x2="1000" y2="800"/>
    <line x1="1100" y1="0" x2="1100" y2="800"/>
  </g>

  <!-- ── State machine flow: CREATED → BOOKED → ASSIGNED → IN_TRANSIT → DELIVERED ── -->

  <!-- Edges main flow -->
  <line x1="228" y1="268" x2="360" y2="268" stroke="url(#edge-warm)" stroke-width="1.5" marker-end="url(#arrow-warm)"/>
  <line x1="476" y1="268" x2="560" y2="268" stroke="url(#edge-warm)" stroke-width="1.5" marker-end="url(#arrow-warm)"/>
  <line x1="676" y1="268" x2="760" y2="268" stroke="url(#edge-orange)" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <line x1="876" y1="268" x2="960" y2="268" stroke="url(#edge-warm)" stroke-width="1.5" marker-end="url(#arrow-warm)"/>

  <!-- Node halos -->
  <circle cx="180" cy="268" r="52" fill="url(#node-glow-warm)"/>
  <circle cx="420" cy="268" r="52" fill="url(#node-glow-warm)"/>
  <circle cx="620" cy="268" r="52" fill="url(#node-glow-warm)"/>
  <circle cx="820" cy="268" r="64" fill="url(#node-glow-orange)"/>
  <circle cx="1020" cy="268" r="52" fill="url(#node-glow-warm)"/>

  <!-- Node: CREATED -->
  <circle cx="180" cy="268" r="28" fill="#1A1A2E" stroke="#4A4A5A" stroke-width="1.5" filter="url(#glow-sm)"/>
  <circle cx="180" cy="268" r="5" fill="#FAFAF8" opacity="0.6"/>
  <text x="180" y="311" text-anchor="middle" fill="#9A9A92" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="10" letter-spacing="0.12em">CREATED</text>

  <!-- Node: BOOKED -->
  <circle cx="420" cy="268" r="28" fill="#1A1A2E" stroke="#4A4A5A" stroke-width="1.5" filter="url(#glow-sm)"/>
  <circle cx="420" cy="268" r="5" fill="#FAFAF8" opacity="0.6"/>
  <text x="420" y="311" text-anchor="middle" fill="#9A9A92" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="10" letter-spacing="0.12em">BOOKED</text>

  <!-- Node: ASSIGNED -->
  <circle cx="620" cy="268" r="28" fill="#1A1A2E" stroke="#4A4A5A" stroke-width="1.5" filter="url(#glow-sm)"/>
  <circle cx="620" cy="268" r="5" fill="#FAFAF8" opacity="0.6"/>
  <text x="620" y="311" text-anchor="middle" fill="#9A9A92" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="10" letter-spacing="0.12em">ASSIGNED</text>

  <!-- Node: IN_TRANSIT (active — orange accent) -->
  <circle cx="820" cy="268" r="38" fill="#1A1A2E" stroke="#E85D04" stroke-width="2" filter="url(#glow-lg)"/>
  <circle cx="820" cy="268" r="11" fill="#E85D04" opacity="0.95"/>
  <text x="820" y="320" text-anchor="middle" fill="#E85D04" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="10" letter-spacing="0.12em">IN_TRANSIT</text>

  <!-- Node: DELIVERED -->
  <circle cx="1020" cy="268" r="28" fill="#1A1A2E" stroke="#6B6B63" stroke-width="1.5" filter="url(#glow-sm)"/>
  <circle cx="1020" cy="268" r="5" fill="#9A9A92" opacity="0.8"/>
  <text x="1020" y="311" text-anchor="middle" fill="#9A9A92" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="10" letter-spacing="0.12em">DELIVERED</text>

  <!-- ── Exception branches ── -->
  <line x1="820" y1="306" x2="820" y2="428" stroke="#E85D04" stroke-width="1" stroke-dasharray="4,3" opacity="0.45" marker-end="url(#arrow-orange)"/>
  <line x1="420" y1="296" x2="420" y2="428" stroke="#6B6B63" stroke-width="1" stroke-dasharray="4,3" opacity="0.35" marker-end="url(#arrow-muted)"/>

  <!-- Node: CANCELLED -->
  <circle cx="420" cy="460" r="22" fill="#1A1A2E" stroke="#4A4A5A" stroke-width="1" opacity="0.55"/>
  <circle cx="420" cy="460" r="4" fill="#6B6B63" opacity="0.6"/>
  <text x="420" y="494" text-anchor="middle" fill="#6B6B63" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="9" letter-spacing="0.1em" opacity="0.6">CANCELLED</text>

  <!-- Node: DISPUTED -->
  <circle cx="820" cy="460" r="22" fill="#1A1A2E" stroke="#E85D04" stroke-width="1" opacity="0.55"/>
  <circle cx="820" cy="460" r="4" fill="#E85D04" opacity="0.6"/>
  <text x="820" y="494" text-anchor="middle" fill="#E85D04" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="9" letter-spacing="0.1em" opacity="0.6">DISPUTED</text>

  <!-- Edge: DISPUTED → RESOLVED -->
  <line x1="842" y1="460" x2="960" y2="460" stroke="#E85D04" stroke-width="1" stroke-dasharray="4,3" opacity="0.35" marker-end="url(#arrow-orange)"/>
  <!-- Node: RESOLVED -->
  <circle cx="988" cy="460" r="22" fill="#1A1A2E" stroke="#6B6B63" stroke-width="1" opacity="0.45"/>
  <circle cx="988" cy="460" r="4" fill="#9A9A92" opacity="0.5"/>
  <text x="988" y="494" text-anchor="middle" fill="#9A9A92" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="9" letter-spacing="0.1em" opacity="0.5">RESOLVED</text>

  <!-- ── State machine label chips ── -->
  <rect x="1076" y="206" width="92" height="22" rx="3" fill="#E85D04" fill-opacity="0.12" stroke="#E85D04" stroke-width="0.5" stroke-opacity="0.4"/>
  <text x="1122" y="221" text-anchor="middle" fill="#E85D04" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="9" letter-spacing="0.14em" opacity="0.8">SM_FREIGHT</text>

  <rect x="1076" y="440" width="92" height="22" rx="3" fill="#E85D04" fill-opacity="0.08" stroke="#E85D04" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="1122" y="455" text-anchor="middle" fill="#E85D04" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="9" letter-spacing="0.14em" opacity="0.6">SM_DISPUTE</text>

  <!-- ── Metric strip ── -->
  <rect x="76" y="560" width="1048" height="144" rx="8" fill="#131320" fill-opacity="0.75" stroke="#2A2A3A" stroke-width="0.5"/>

  <!-- Metric 1 -->
  <text x="160" y="600" text-anchor="middle" fill="#6B6B63" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="9" letter-spacing="0.14em">ACTIVE SHIPMENTS</text>
  <text x="160" y="642" text-anchor="middle" fill="#FAFAF8" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="38" letter-spacing="-0.02em" font-weight="600">2,847</text>
  <rect x="100" y="666" width="120" height="2" rx="1" fill="#2A2A3A"/>
  <rect x="100" y="666" width="84" height="2" rx="1" fill="#E85D04" opacity="0.8"/>

  <line x1="280" y1="578" x2="280" y2="690" stroke="#2A2A3A" stroke-width="0.5"/>

  <!-- Metric 2 -->
  <text x="420" y="600" text-anchor="middle" fill="#6B6B63" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="9" letter-spacing="0.14em">ON-TIME RATE</text>
  <text x="420" y="642" text-anchor="middle" fill="#FAFAF8" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="38" letter-spacing="-0.02em" font-weight="600">94.2%</text>
  <rect x="360" y="666" width="120" height="2" rx="1" fill="#2A2A3A"/>
  <rect x="360" y="666" width="113" height="2" rx="1" fill="#E85D04" opacity="0.8"/>

  <line x1="540" y1="578" x2="540" y2="690" stroke="#2A2A3A" stroke-width="0.5"/>

  <!-- Metric 3 -->
  <text x="680" y="600" text-anchor="middle" fill="#6B6B63" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="9" letter-spacing="0.14em">AVG TRANSIT</text>
  <text x="680" y="642" text-anchor="middle" fill="#FAFAF8" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="38" letter-spacing="-0.02em" font-weight="600">18.4h</text>
  <rect x="620" y="666" width="120" height="2" rx="1" fill="#2A2A3A"/>
  <rect x="620" y="666" width="74" height="2" rx="1" fill="#E85D04" opacity="0.7"/>

  <line x1="800" y1="578" x2="800" y2="690" stroke="#2A2A3A" stroke-width="0.5"/>

  <!-- Metric 4 -->
  <text x="960" y="600" text-anchor="middle" fill="#6B6B63" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="9" letter-spacing="0.14em">STATE MACHINES</text>
  <text x="960" y="642" text-anchor="middle" fill="#FAFAF8" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="38" letter-spacing="-0.02em" font-weight="600">6</text>
  <text x="960" y="675" text-anchor="middle" fill="#6B6B63" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="9" letter-spacing="0.12em">DOMAIN-DRIVEN</text>

  <!-- ── Wordmark ── -->
  <text x="76" y="148" fill="#FAFAF8" font-family="-apple-system,'SF Pro Display',system-ui,sans-serif" font-size="56" font-weight="700" letter-spacing="-0.03em" opacity="0.95">FlexFret</text>
  <text x="76" y="178" fill="#6B6B63" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="11" letter-spacing="0.22em">DISTRIBUTED LOGISTICS · STATE MACHINE ARCHITECTURE</text>

  <!-- Vignette -->
  <rect width="1200" height="800" fill="url(#vignette)"/>
</svg>
