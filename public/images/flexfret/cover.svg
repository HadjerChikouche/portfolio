<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#252547"/>
      <stop offset="100%" stop-color="#0D0D1E"/>
    </radialGradient>
    <radialGradient id="node-glow-blue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4F8EF7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4F8EF7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="node-glow-amber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="node-glow-green" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F8EF7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4F8EF7" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="edge-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="edge-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow-sm">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-lg">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4F8EF7" opacity="0.8"/>
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#F59E0B" opacity="0.8"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#34D399" opacity="0.8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bg-glow)"/>

  <!-- Subtle grid -->
  <g opacity="0.04" stroke="#8B9DC3" stroke-width="0.5">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="0" y1="700" x2="1200" y2="700"/>
    <line x1="100" y1="0" x2="100" y2="800"/>
    <line x1="200" y1="0" x2="200" y2="800"/>
    <line x1="300" y1="0" x2="300" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="800"/>
    <line x1="500" y1="0" x2="500" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="700" y1="0" x2="700" y2="800"/>
    <line x1="800" y1="0" x2="800" y2="800"/>
    <line x1="900" y1="0" x2="900" y2="800"/>
    <line x1="1000" y1="0" x2="1000" y2="800"/>
    <line x1="1100" y1="0" x2="1100" y2="800"/>
  </g>

  <!-- ── State machine flow: CREATED → BOOKED → IN_TRANSIT → DELIVERED ── -->
  <!-- Row 1: main freight lifecycle -->

  <!-- Edge: CREATED → BOOKED -->
  <line x1="230" y1="260" x2="362" y2="260" stroke="url(#edge-blue)" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <!-- Edge: BOOKED → ASSIGNED -->
  <line x1="478" y1="260" x2="562" y2="260" stroke="url(#edge-blue)" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <!-- Edge: ASSIGNED → IN_TRANSIT -->
  <line x1="678" y1="260" x2="762" y2="260" stroke="url(#edge-amber)" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <!-- Edge: IN_TRANSIT → DELIVERED -->
  <line x1="878" y1="260" x2="962" y2="260" stroke="url(#edge-green)" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Node glow halos -->
  <circle cx="180" cy="260" r="52" fill="url(#node-glow-blue)"/>
  <circle cx="420" cy="260" r="52" fill="url(#node-glow-blue)"/>
  <circle cx="620" cy="260" r="52" fill="url(#node-glow-blue)"/>
  <circle cx="820" cy="260" r="52" fill="url(#node-glow-amber)"/>
  <circle cx="1020" cy="260" r="52" fill="url(#node-glow-green)"/>

  <!-- Node: CREATED -->
  <circle cx="180" cy="260" r="28" fill="#1A1A2E" stroke="#4F8EF7" stroke-width="1.5" filter="url(#glow-sm)"/>
  <circle cx="180" cy="260" r="6" fill="#4F8EF7" opacity="0.9"/>
  <text x="180" y="303" text-anchor="middle" fill="#4F8EF7" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="10" letter-spacing="0.12em" opacity="0.9">CREATED</text>

  <!-- Node: BOOKED -->
  <circle cx="420" cy="260" r="28" fill="#1A1A2E" stroke="#4F8EF7" stroke-width="1.5" filter="url(#glow-sm)"/>
  <circle cx="420" cy="260" r="6" fill="#4F8EF7" opacity="0.9"/>
  <text x="420" y="303" text-anchor="middle" fill="#4F8EF7" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="10" letter-spacing="0.12em" opacity="0.9">BOOKED</text>

  <!-- Node: ASSIGNED -->
  <circle cx="620" cy="260" r="28" fill="#1A1A2E" stroke="#4F8EF7" stroke-width="1.5" filter="url(#glow-sm)"/>
  <circle cx="620" cy="260" r="6" fill="#4F8EF7" opacity="0.9"/>
  <text x="620" y="303" text-anchor="middle" fill="#4F8EF7" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="10" letter-spacing="0.12em" opacity="0.9">ASSIGNED</text>

  <!-- Node: IN_TRANSIT (active, amber) -->
  <circle cx="820" cy="260" r="36" fill="#1A1A2E" stroke="#F59E0B" stroke-width="2" filter="url(#glow-lg)"/>
  <circle cx="820" cy="260" r="10" fill="#F59E0B" opacity="0.95"/>
  <text x="820" y="311" text-anchor="middle" fill="#F59E0B" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="10" letter-spacing="0.12em" opacity="0.9">IN_TRANSIT</text>

  <!-- Node: DELIVERED (green) -->
  <circle cx="1020" cy="260" r="28" fill="#1A1A2E" stroke="#34D399" stroke-width="1.5" filter="url(#glow-sm)"/>
  <circle cx="1020" cy="260" r="6" fill="#34D399" opacity="0.9"/>
  <text x="1020" y="303" text-anchor="middle" fill="#34D399" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="10" letter-spacing="0.12em" opacity="0.9">DELIVERED</text>

  <!-- ── Row 2: exception branches ── -->
  <!-- Edge: IN_TRANSIT → DISPUTED (down) -->
  <line x1="820" y1="296" x2="820" y2="418" stroke="#F59E0B" stroke-width="1" stroke-dasharray="4,3" opacity="0.5" marker-end="url(#arrow-amber)"/>

  <!-- Edge: BOOKED → CANCELLED (down) -->
  <line x1="420" y1="288" x2="420" y2="418" stroke="#4F8EF7" stroke-width="1" stroke-dasharray="4,3" opacity="0.4" marker-end="url(#arrow-blue)"/>

  <!-- Node: CANCELLED -->
  <circle cx="420" cy="450" r="22" fill="#1A1A2E" stroke="#4F8EF7" stroke-width="1" opacity="0.6"/>
  <circle cx="420" cy="450" r="5" fill="#4F8EF7" opacity="0.6"/>
  <text x="420" y="484" text-anchor="middle" fill="#4F8EF7" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="9" letter-spacing="0.1em" opacity="0.6">CANCELLED</text>

  <!-- Node: DISPUTED -->
  <circle cx="820" cy="450" r="22" fill="#1A1A2E" stroke="#F59E0B" stroke-width="1" opacity="0.6"/>
  <circle cx="820" cy="450" r="5" fill="#F59E0B" opacity="0.6"/>
  <text x="820" y="484" text-anchor="middle" fill="#F59E0B" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="9" letter-spacing="0.1em" opacity="0.6">DISPUTED</text>

  <!-- Edge: DISPUTED → RESOLVED -->
  <line x1="842" y1="450" x2="962" y2="450" stroke="#F59E0B" stroke-width="1" stroke-dasharray="4,3" opacity="0.4" marker-end="url(#arrow-amber)"/>
  <!-- Node: RESOLVED -->
  <circle cx="990" cy="450" r="22" fill="#1A1A2E" stroke="#34D399" stroke-width="1" opacity="0.5"/>
  <circle cx="990" cy="450" r="5" fill="#34D399" opacity="0.5"/>
  <text x="990" y="484" text-anchor="middle" fill="#34D399" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="9" letter-spacing="0.1em" opacity="0.5">RESOLVED</text>

  <!-- ── State machine label band (right) ── -->
  <rect x="1080" y="200" width="88" height="22" rx="3" fill="#4F8EF7" fill-opacity="0.12" stroke="#4F8EF7" stroke-width="0.5" stroke-opacity="0.4"/>
  <text x="1124" y="215" text-anchor="middle" fill="#4F8EF7" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="9" letter-spacing="0.14em" opacity="0.8">SM_FREIGHT</text>

  <rect x="1080" y="430" width="88" height="22" rx="3" fill="#F59E0B" fill-opacity="0.10" stroke="#F59E0B" stroke-width="0.5" stroke-opacity="0.4"/>
  <text x="1124" y="445" text-anchor="middle" fill="#F59E0B" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="9" letter-spacing="0.14em" opacity="0.7">SM_DISPUTE</text>

  <!-- ── Real-time metric strips at bottom ── -->
  <!-- Strip background -->
  <rect x="76" y="560" width="1048" height="140" rx="8" fill="#131328" fill-opacity="0.7" stroke="#2A2A4A" stroke-width="0.5"/>

  <!-- Metric 1: Active shipments -->
  <text x="160" y="600" text-anchor="middle" fill="#8B9DC3" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="9" letter-spacing="0.14em" opacity="0.7">ACTIVE SHIPMENTS</text>
  <text x="160" y="640" text-anchor="middle" fill="#E2E8F0" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="38" letter-spacing="-0.02em" font-weight="600">2,847</text>
  <!-- mini bar -->
  <rect x="100" y="662" width="120" height="2" rx="1" fill="#2A2A4A"/>
  <rect x="100" y="662" width="84" height="2" rx="1" fill="#4F8EF7" opacity="0.8"/>

  <!-- Divider -->
  <line x1="280" y1="575" x2="280" y2="685" stroke="#2A2A4A" stroke-width="0.5"/>

  <!-- Metric 2: On-time rate -->
  <text x="420" y="600" text-anchor="middle" fill="#8B9DC3" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="9" letter-spacing="0.14em" opacity="0.7">ON-TIME RATE</text>
  <text x="420" y="640" text-anchor="middle" fill="#34D399" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="38" letter-spacing="-0.02em" font-weight="600">94.2%</text>
  <rect x="360" y="662" width="120" height="2" rx="1" fill="#2A2A4A"/>
  <rect x="360" y="662" width="113" height="2" rx="1" fill="#34D399" opacity="0.8"/>

  <!-- Divider -->
  <line x1="540" y1="575" x2="540" y2="685" stroke="#2A2A4A" stroke-width="0.5"/>

  <!-- Metric 3: Avg transit -->
  <text x="680" y="600" text-anchor="middle" fill="#8B9DC3" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="9" letter-spacing="0.14em" opacity="0.7">AVG TRANSIT</text>
  <text x="680" y="640" text-anchor="middle" fill="#F59E0B" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="38" letter-spacing="-0.02em" font-weight="600">18.4h</text>
  <rect x="620" y="662" width="120" height="2" rx="1" fill="#2A2A4A"/>
  <rect x="620" y="662" width="74" height="2" rx="1" fill="#F59E0B" opacity="0.8"/>

  <!-- Divider -->
  <line x1="800" y1="575" x2="800" y2="685" stroke="#2A2A4A" stroke-width="0.5"/>

  <!-- Metric 4: State machines -->
  <text x="960" y="600" text-anchor="middle" fill="#8B9DC3" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="9" letter-spacing="0.14em" opacity="0.7">STATE MACHINES</text>
  <text x="960" y="640" text-anchor="middle" fill="#E2E8F0" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="38" letter-spacing="-0.02em" font-weight="600">6</text>
  <text x="960" y="672" text-anchor="middle" fill="#8B9DC3" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="9" letter-spacing="0.12em" opacity="0.6">DOMAIN-DRIVEN</text>

  <!-- ── Wordmark ── -->
  <text x="76" y="148" fill="#E2E8F0" font-family="-apple-system,'SF Pro Display',system-ui,sans-serif" font-size="56" font-weight="700" letter-spacing="-0.03em" opacity="0.95">FlexFret</text>
  <text x="76" y="176" fill="#8B9DC3" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="11" letter-spacing="0.22em" opacity="0.7">DISTRIBUTED LOGISTICS · STATE MACHINE ARCHITECTURE</text>

  <!-- Vignette -->
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0D0D1E" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0D0D1E" stop-opacity="0.65"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#vignette)"/>
</svg>
